<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayNexa - Business Client Login</title>
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: var(--bg-tertiary);
      overflow: hidden; /* No scroll */
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
      padding: var(--space-4);
    }
    .auth-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--space-8);
      box-shadow: var(--shadow-lg);
      width: 100%;
    }
    .social-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-weight: var(--weight-label);
      font-size: var(--size-label);
      cursor: pointer;
      transition: var(--transition);
      margin-bottom: var(--space-3);
    }
    .social-btn:hover {
      background: var(--bg-tertiary);
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: var(--space-6) 0;
      color: var(--text-muted);
      font-size: var(--size-caption);
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }
    .divider:not(:empty)::before { margin-right: .5em; }
    .divider:not(:empty)::after { margin-left: .5em; }
  </style>
</head>
<body>

  <!-- NO Theme Toggle, NO Back to Home -->

  <div class="auth-container animate-fade-up">
    <div class="text-center mb-8">
      <div class="logo justify-center mb-2">
        <i class="ph-fill ph-credit-card logo-icon"></i> PayNexa
      </div>
      <p class="text-muted">Business Client Portal</p>
    </div>

    <div class="auth-card">
      <h3 class="mb-6 text-center">Sign in</h3>
      
      <form data-validate action="dashboard.html" method="GET">
        <div class="form-group">
          <label for="email" class="form-label">Business Email</label>
          <input type="email" id="email" class="form-control" required placeholder="name@company.com">
        </div>
        
        <div class="form-group mb-6">
          <div class="flex justify-between items-center mb-2">
            <label for="password" class="form-label mb-0">Password</label>
            <a href="#" class="text-accent font-size-caption">Forgot password?</a>
          </div>
          <input type="password" id="password" class="form-control" required placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢">
        </div>

        <button type="submit" class="btn btn-primary w-full" style="width: 100%;">Login</button>
      </form>

      <div class="divider">or</div>

      <button class="social-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.64 9.20455C17.64 8.56636 17.5827 7.95273 17.4764 7.36364H9V10.845H13.8436C13.635 11.97 13.0009 12.9232 12.0477 13.5614V15.8195H14.9564C16.6582 14.2527 17.64 11.9455 17.64 9.20455Z" fill="#4285F4"/>
          <path d="M9 18C11.43 18 13.4673 17.1941 14.9564 15.8195L12.0477 13.5614C11.2418 14.1014 10.2109 14.4205 9 14.4205C6.65591 14.4205 4.67182 12.8373 3.96409 10.71H0.957275V13.0418C2.43818 15.9832 5.48182 18 9 18Z" fill="#34A853"/>
          <path d="M3.96409 10.71C3.78409 10.17 3.68182 9.59318 3.68182 9C3.68182 8.40682 3.78409 7.83 3.96409 7.29H0.957275V4.95818C0.347727 6.17318 0 7.54773 0 9C0 10.4523 0.347727 11.8268 0.957275 13.0418L3.96409 10.71Z" fill="#FBBC05"/>
          <path d="M9 3.57955C10.3214 3.57955 11.5077 4.03364 12.4405 4.92545L15.0218 2.34409C13.4632 0.891818 11.4259 0 9 0C5.48182 0 2.43818 2.01682 0.957275 4.95818L3.96409 7.29C4.67182 5.16273 6.65591 3.57955 9 3.57955Z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>
      
      <button class="social-btn">
        <i class="ph-fill ph-apple-logo" style="font-size: 1.25rem;"></i>
        Continue with Apple
      </button>

    </div>

    <p class="text-center mt-6 font-size-caption text-secondary">
      Don't have a business account? <a href="register.html" class="text-accent">Register</a>
    </p>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
